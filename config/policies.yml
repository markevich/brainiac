# Brainiac safety and write policies

default_mode: "ask_before_source_mutation"

sensitive_paths:
  - path: "2_Areas/Здоровье/"
    policy: "read_with_citations_ask_before_write"
  - path: "2_Areas/Семья/"
    policy: "read_with_citations_ask_before_write"
  - path: "2_Areas/Налоги/"
    policy: "read_with_citations_ask_before_write"

write_policy:
  allowed_without_confirmation:
    - "Brainiac/memory/generated/"
    - "Brainiac/memory/queue/"
    - "Brainiac/memory/logs/"
    - "Brainiac/memory/index/"

  ask_before_write:
    - "0_Inbox/"
    - "1_Projects/"
    - "2_Areas/"
    - "3_Resources/"
    - "ibooks-highlights/"
    - "Brainiac/memory/synthesis/"

  always_confirm:
    - "delete_file"
    - "move_many_files"
    - "rewrite_canonical_note"
    - "change_operator_rules"
    - "modify_sensitive_note"
    - "modify_routing_policy"

logging:
  operations_log: "Brainiac/memory/logs/operations.md"
  log_all_writes: true

html_policy:
  canonical: false
  direct_vault_write: false
  allowed_as_generated_artifact: true

synthesis_policy:
  canonical: false
  derived_memory: true
  dry_run_command: "synthesis suggest"
  write_mode: "review_before_apply"
  require_source_links: true
  require_source_snapshots: true
  require_explicit_confirmation: true
