# Brainiac vault configuration template.
# Copy this file to config/vault.yml and set vault.root for your local machine.

vault:
  name: "Unknown vault"
  root: ""

exclude:
  - ".obsidian/"
  - ".trash/"

source_formats:
  markdown:
    - "*.md"
  canvas:
    - "*.canvas"
  structured:
    - "*.json"
    - "*.yml"
    - "*.yaml"
    - "*.csv"
    - "*.sqlite"
    - "*.db"

generated_paths:
  root: "memory/generated/"
  dashboards: "memory/generated/dashboards/"
  reports: "memory/generated/reports/"
  artifacts: "memory/generated/artifacts/"

index:
  path: "memory/index/brainiac.sqlite"
  disposable: true
